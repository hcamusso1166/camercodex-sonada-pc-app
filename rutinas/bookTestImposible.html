<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Rutina Soñada - Book Test Imposible</title>
  <link rel="stylesheet" type="text/css" href="../css/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    .booktest-subtitle {
      color: #9da5b1;
      margin: 0 0 16px;
      font-size: 0.95rem;
    }

    .booktest-state-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 0;
      gap: 12px;
      color: #d9d9d9;
    }

.booktest-state-label {
      color: #9da5b1;
    }

    .booktest-log {
      margin-top: 12px;
      max-height: 180px;
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.2);
      font-size: 0.9rem;
      color: #d9d9d9;
    }

    .booktest-log p {
      margin: 0 0 8px;
      line-height: 1.25;
    }

    .booktest-log p:last-child {
      margin-bottom: 0;
    }

    .booktest-log-empty {
      color: #9da5b1;
      font-style: italic;
    }
  </style>
</head>
<body>
<header id="headerRoutine">Camer Codex <sup>&reg;</sup></header>

<div class="rutina">Rutina Soñada</div>

<div class="content">
  <div class="card-grid single-column">
    <div class="card dark-card">
      <h2>Rutina Soñada</h2>
      <p class="booktest-subtitle">Book Test Imposible</p>

      <div class="booktest-state-row">
      <span class="booktest-state-label">Estado TP</span>
      <strong id="tpConnectionState">TP no conectado</strong>
      </div>
      <div class="booktest-state-row">
        <span class="booktest-state-label">Libro actual</span>
        <strong id="bookTitle">Sin libro</strong>
      </div>
      <div class="booktest-state-row">
        <span class="booktest-state-label">Página actual</span>
        <strong id="bookPage">-</strong>
      </div>
      <div class="booktest-state-row">
        <span class="booktest-state-label">Línea actual</span>
        <strong id="bookLine">-</strong>
      </div>

      <div class="button-row" style="margin-top: 16px;">
        <button id="simulatePayloadButton" class="button-primary" type="button">Simular payload</button>
        <button id="clearStateButton" class="button-secondary" type="button">Limpiar</button>
      </div>

      <div class="booktest-log" id="bookTestLog" aria-live="polite">
        <p class="booktest-log-empty">Sin eventos todavía.</p>
      </div>
    </div>
    <div class="card dark-card compacto">
      <h3>Dispositivo Bluetooth (BLE)</h3>
      <div class="button-row">
        <button id="connectBleButton" class="button-primary connectButton">
          <img src="../icons/bluetooth.svg" alt="Bluetooth Icon" id="icon-left">
          Conectar
        </button>
        <button id="disconnectBleButton" class="button-primary disconnectButton">
          <img src="../icons/bluetooth_disabled.svg" alt="Disconnect Bluetooth Icon" id="icon-left">
          Desconectar
        </button>
        <div class="gray-label">
          BLE primario (antena 1/9):
          <strong><span id="bleState" style="color:#d13a30;">Desconectado</span></strong>
          <small id="blePrimaryRef"></small>
        </div>
        <div class="gray-label">
          BLE multiantena (2 a 6):
          <strong><span id="bleStateSecondary" style="color:#d13a30;">Desconectado</span></strong>
          <small id="bleSecondaryRef"></small>
        </div>
      </div>
    </div>

    <div class="card dark-card">
      <button onclick="window.location.href='../index.html'" class="button-secondary" type="button">
        <img src="../icons/home_F3B13F.svg" alt="Home" id="icon-left">
        Volver al Menú
      </button>
    </div>
  </div>
</div>

<footer>v <span id="appVersion"></span></footer>
<script src="../js/main.js"></script>
<script src="../js/config.js"></script>
<script src="../js/rutinas/bookTestImposible.js"></script>
</body>
</html>
